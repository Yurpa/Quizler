<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Quiz – Quizler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/quiz-play.css">
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="top-bar-btn" id="top-login-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span id="top-login-label">Login</span>
  </button>
</div>

<!-- MAIN NAV -->
<nav class="main-nav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2L37 33H3L20 2Z" stroke="#0A0A0A" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M20 13L29 30H11L20 13Z" stroke="#0A0A0A" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </svg>
    Quizler
  </a>
  <ul class="nav-links">
    <li><a class="nav-link" id="nav-leaderboards" href="leaderboards.html">Leaderboards</a></li>
    <li><a class="nav-link" id="nav-account" href="javascript:void(0)">My Account</a></li>
    <li style="position:relative">
      <div class="nav-link" id="nav-quizzes">
        Quizzes
        <svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l5 5 5-5"/></svg>
      </div>
      <div class="nav-dropdown" id="quiz-dropdown">
        <div class="nav-dropdown-label">Categories:</div>
        <div id="quiz-dropdown-items"></div>
      </div>
    </li>
    <li id="nav-admin-wrap" style="display:none">
      <a class="nav-link admin-link" id="nav-admin" href="admin.html">⚙ Admin</a>
    </li>
  </ul>
</nav>

<main>
  <div class="qp-content">

    <!-- Header row -->
    <div class="qp-header">
      <div class="qp-counter" id="qp-counter">Question 1 out of 5.</div>
      <div class="qp-quiz-title" id="qp-quiz-title"></div>
    </div>

    <!-- Warning message (unanswered question) -->
    <div class="msg msg-warn" id="qp-warn" style="margin-bottom:14px;"></div>

    <!-- Question card -->
    <div class="qp-card">
      <div>
        <div class="qp-question" id="qp-question"></div>
        <div class="qp-options"  id="qp-options"></div>
      </div>
      <div class="qp-right">
        <div class="qp-timer" id="qp-timer">Time Left: 01:00</div>
        <!-- Play mode: Continue / Submit -->
        <button class="btn btn-primary btn-lg" id="qp-continue-btn">Continue</button>
        <!-- Review mode: Prev / Next (hidden during play) -->
        <div id="qp-review-nav" class="hidden" style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
          <button class="btn btn-outline" id="review-prev-btn">← Prev</button>
          <button class="btn btn-primary" id="review-next-btn">Next →</button>
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="qp-progress" style="margin-top:20px;">
      <div class="qp-progress-bar" id="qp-progress-bar" style="width:0%"></div>
    </div>

  </div>
</main>

<footer class="site-footer"><span>© 2025 Quizler – Educational Quiz Platform</span></footer>

<!-- COMPLETION MODAL -->
<div class="modal-overlay" id="completion-modal">
  <div class="modal-card">
    <div class="modal-title">🎉 Quiz Complete!</div>
    <div class="modal-div"></div>
    <div class="modal-stats"     id="modal-stats"></div>
    <div class="modal-score-lbl">Your final score is:</div>
    <div class="modal-score-val" id="modal-score"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-lg" id="modal-review-btn">Review Answers</button>
      <a      class="btn btn-primary btn-lg" href="index.html">Go Home</a>
    </div>
  </div>
</div>


<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/nav.js"></script>
<script src="js/quiz-play.js"></script>
</body>
</html>
