<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Quizler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="top-bar-btn" id="top-login-btn" onclick="Nav.topBarClick()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span id="top-login-label">Login</span>
  </button>
</div>

<!-- MAIN NAV -->
<nav class="main-nav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2L37 33H3L20 2Z" stroke="#0A0A0A" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M20 13L29 30H11L20 13Z" stroke="#0A0A0A" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </svg>
    Quizler
  </a>
  <ul class="nav-links">
    <li><a class="nav-link" id="nav-leaderboards" href="leaderboards.html">Leaderboards</a></li>
    <li><a class="nav-link" id="nav-account" href="javascript:void(0)" onclick="Nav.navAccount()">My Account</a></li>
    <li style="position:relative">
      <div class="nav-link" id="nav-quizzes" onclick="Nav.toggleDropdown()">
        Quizzes
        <svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l5 5 5-5"/></svg>
      </div>
      <div class="nav-dropdown" id="quiz-dropdown">
        <div class="nav-dropdown-label">Categories:</div>
        <div id="quiz-dropdown-items"></div>
      </div>
    </li>
    <li id="nav-admin-wrap" style="display:none">
      <a class="nav-link admin-link" id="nav-admin" href="admin.html">⚙ Admin</a>
    </li>
  </ul>
</nav>

<main>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-title">Registration</div>
      <div class="auth-subtitle">Already have an account? <a class="auth-link" href="login.html">Login.</a></div>
      <div class="auth-sep"></div>

      <div class="msg msg-error"   id="reg-error"></div>
      <div class="msg msg-success" id="reg-success"></div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="reg-email" type="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-username">Username <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="reg-username" type="text" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-pass">Password <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="reg-pass" type="password" placeholder="Minimum 8 characters">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-pass2">Repeat Password <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="reg-pass2" type="password" placeholder="Repeat your password">
      </div>

      <p class="auth-mandatory-note">Fields marked <span style="color:var(--red)">*</span> are mandatory for registration.</p>

      <button class="btn btn-primary btn-full btn-lg" onclick="Auth.doRegister()">Create Account</button>
    </div>
  </div>
</main>

<footer class="site-footer"><span>© 2025 Quizler – Educational Quiz Platform</span></footer>


<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Nav.init();
    if (State.currentUser) window.location.href = 'index.html';
  });
</script>
</body>
</html>
