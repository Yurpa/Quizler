# ============================================================
# QUIZLER — render.yaml
# Render Infrastructure-as-Code.
# Deploy the entire stack (web service + PostgreSQL) in one click
# by connecting this repository on render.com/dashboard.
# ============================================================

services:
  # ── Node.js Web Service ───────────────────────────────────
  - type: web
    name: quizler
    runtime: node
    plan: free                     # upgrade to starter ($7/mo) for persistent storage
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/auth/me  # returns 401 (not 404) — proves the app is alive

    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true        # Render generates a random secret automatically

      - key: DATABASE_URL
        fromDatabase:
          name: quizler-db
          property: connectionString

      - key: ALLOWED_ORIGINS
        value: ""                  # Leave blank — Render origin is auto-allowed by server.js

  # ── Managed PostgreSQL ────────────────────────────────────
databases:
  - name: quizler-db
    plan: free                     # Free tier: 90-day expiry, 256 MB storage
    databaseName: quizler
    user: quizler_user
