<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – Quizler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/quizzes.css">
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="top-bar-btn" id="top-login-btn" onclick="Nav.topBarClick()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span id="top-login-label">Login</span>
  </button>
</div>

<!-- MAIN NAV -->
<nav class="main-nav">
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2L37 33H3L20 2Z" stroke="#0A0A0A" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M20 13L29 30H11L20 13Z" stroke="#0A0A0A" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </svg>
    Quizler
  </a>
  <ul class="nav-links">
    <li><a class="nav-link" id="nav-leaderboards" href="leaderboards.html">Leaderboards</a></li>
    <li><a class="nav-link" id="nav-account" href="javascript:void(0)" onclick="Nav.navAccount()">My Account</a></li>
    <li style="position:relative">
      <div class="nav-link" id="nav-quizzes" onclick="Nav.toggleDropdown()">
        Quizzes
        <svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l5 5 5-5"/></svg>
      </div>
      <div class="nav-dropdown" id="quiz-dropdown">
        <div class="nav-dropdown-label">Categories:</div>
        <div id="quiz-dropdown-items"></div>
      </div>
    </li>
    <li id="nav-admin-wrap" style="display:none">
      <a class="nav-link admin-link" id="nav-admin" href="admin.html">⚙ Admin</a>
    </li>
  </ul>
</nav>

<main>
  <div class="qd-content">

    <!-- Breadcrumb -->
    <p style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">
      <a href="quizzes.html" style="text-decoration:underline;color:var(--gray-500)">← Back to Quizzes</a>
    </p>

    <!-- Hero card -->
    <div class="qd-hero">
      <div>
        <div class="qd-completed-badge" id="qd-completed-badge" style="display:none">
          ✓ Already Completed
        </div>
        <div class="qd-name" id="qd-name"></div>
        <div class="qd-desc" id="qd-desc"></div>
        <button class="btn btn-primary btn-lg" onclick="startQuiz()">Play</button>
      </div>
      <div class="qd-img">Optional Image<br>for the Quiz</div>
    </div>

    <!-- Stats bar -->
    <div class="qd-stats">
      <div class="qd-stat">
        <div class="qd-stat-lbl"># Questions</div>
        <div class="qd-stat-val" id="qd-q-count"></div>
      </div>
      <div class="qd-stat">
        <div class="qd-stat-lbl">Updated</div>
        <div class="qd-stat-val" id="qd-updated"></div>
      </div>
      <div class="qd-stat">
        <div class="qd-stat-lbl">Difficulty</div>
        <div class="qd-stat-val" id="qd-diff"></div>
      </div>
      <div class="qd-stat">
        <div class="qd-stat-lbl">Avg Score</div>
        <div class="qd-stat-val" id="qd-avg"></div>
      </div>
      <div class="qd-stat">
        <div class="qd-stat-lbl">Time Limit / Q</div>
        <div class="qd-stat-val" id="qd-time"></div>
      </div>
    </div>

    <!-- Top 5 leaderboard -->
    <div class="qd-lb-card">
      <div class="qd-lb-head">
        <div class="qd-lb-hcell">Rank</div>
        <div class="qd-lb-hcell">User</div>
        <div class="qd-lb-hcell" style="text-align:right">Score</div>
      </div>
      <div id="qd-lb-rows"></div>
      <div class="qd-lb-bottom">
        <a class="btn btn-primary" href="leaderboards.html">View All Leaderboards</a>
      </div>
    </div>

  </div>
</main>

<footer class="site-footer"><span>© 2025 Quizler – Educational Quiz Platform</span></footer>

<script src="js/db.js"></script>
<script src="js/state.js"></script>
<script src="js/nav.js"></script>
<script src="js/quiz-detail.js"></script>
</body>
</html>
